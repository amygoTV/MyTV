appId: com.amygotv.mediasshell
productName: MediaShell
copyright: Copyright (c) 2026 amygoTV
directories:
  app: _stage
  output: dist-exe-v147
  buildResources: build
afterPack: scripts/apply_icon.js
afterAllArtifactBuild: scripts/apply_final_icon.js
files:
  - "**/*"
  - "!node_modules/**"
asar: true
compression: maximum
win:
  icon: build/icon.ico
  target:
    - target: portable
      arch: x64
  artifactName: MediaShell-${version}-portable.${ext}
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: false
portable:
  unpackDirName: MediaShellData
electronDist: ./node_modules/electron/dist
electronVersion: 28.3.3
