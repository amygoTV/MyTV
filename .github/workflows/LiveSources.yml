name: Live Sources Rebuild

# 直播源自动重建（每天凌晨 02:17 北京时间跑一次）
# 流程：权威频道表保底(CCTV1-17/31省卫视+深圳/教育台) + 上游补充 → 过滤广告/错台
#       → 逐条实测 IPv4 可播性 → IPv6 备用保留 → 3 IPv4 + 2 IPv6 组装 → 校验 → 提交
#
# 所有筛选逻辑都在本仓库脚本中，CI 仅负责定时触发：
#   scripts/channel_plan.json      权威频道表（保底频道/顺序/保底源）
#   scripts/build_live_sources.py  过滤 + 探测 + 组装
#   本文件下方的 Validate 步骤          格式/广告/保底频道/顺序校验（失败不提交）

on:
  schedule:
    # 每天北京时间 02:17（UTC 18:17）跑一次，避开整点高峰
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      probe_limit:
        description: '探测总量上限（0=全部，默认500；保底频道不受影响）'
        required: false
        default: '500'

permissions:
  contents: write
  issues: write

concurrency:
  group: live-sources-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild live sources (plan + probe + filter + merge)
        run: |
          # probe-limit 控制探测总量，避免 CI 上全量(800+)探测超时；权威频道表保底不受影响
          python3 scripts/build_live_sources.py --out-dir . --workers 32 --probe-limit "${{ inputs.probe_limit || '500' }}"

      - name: Validate output (format / ad / must-have channels / order)
        run: |
          python3 - <<'PY'
          import json, os, re, sys

          bad, warn = [], []
          files = ['TVLives.txt', 'BiliLive.txt', 'LiveSports.txt']
          for f in files:
              if not os.path.exists(f):
                  bad.append(f + ': 文件缺失'); continue
              groups, chans, urls = 0, 0, 0
              for line in open(f, encoding='utf-8'):
                  line = line.strip()
                  if not line:
                      continue
                  if line.endswith('#genre#'):
                      groups += 1; continue
                  i = line.find(',')
                  if i <= 0:
                      bad.append('%s: 非法行 %r' % (f, line[:40])); continue
                  chans += 1
                  urls += len([u for u in line[i+1:].split(',') if u.strip().startswith('http')])
              print('%-18s %2d组 %4d频道 %4d线路' % (f, groups, chans, urls))
              if groups == 0 or chans == 0:
                  bad.append(f + ': 解析结果为空')

          # 广告残留检查
          ad = re.compile(r'(支持作者|请\s*user|扫码|公众号|列表更新时间|广告|维护中?)', re.I)
          for f in files:
              if not os.path.exists(f):
                  continue
              for ln, line in enumerate(open(f, encoding='utf-8'), 1):
                  if ad.search(line):
                      bad.append('%s:%d 广告残留 %r' % (f, ln, line.strip()[:50]))

          # 地方频道组不应出现
          if os.path.exists('TVLives.txt'):
              for line in open('TVLives.txt', encoding='utf-8'):
                  if line.startswith('地方频道,#genre#'):
                      bad.append('TVLives.txt: 不应包含地方频道组')

          # 保底频道必须存在（来自权威频道表）
          plan = json.load(open('scripts/channel_plan.json', encoding='utf-8'))
          must = set(plan['channels'].keys())
          lines = open('TVLives.txt', encoding='utf-8').read().split('\n') if os.path.exists('TVLives.txt') else []
          present = set()
          for line in lines:
              i = line.find(',')
              if i > 0 and not line.endswith('#genre#'):
                  present.add(line[:i].strip())
          missing = sorted(must - present)
          if missing:
              bad.append('TVLives.txt 缺少保底频道: ' + ', '.join(missing))

          # 央视组顺序校验：只取「央视频道,#genre#」段内的频道
          cctv, in_group = [], False
          for l in lines:
              if l.endswith(',#genre#'):
                  in_group = (l == '央视频道,#genre#'); continue
              if in_group and l.strip():
                  cctv.append(l.split(',')[0].strip())
          expect = [x for x in (plan['cctv_order'] + plan['paid_order'] + plan['cgtn_order'] + plan['edu_order'])
                    if x in set(cctv)]
          if cctv != expect:
              bad.append('央视组顺序与权威表不一致: %s' % ', '.join(cctv[:30]))

          # 港澳台组顺序校验（凤凰香港/凤凰卫视/…按权威表顺序）
          hktw, in_group = [], False
          for l in lines:
              if l.endswith(',#genre#'):
                  in_group = (l == '港澳台频道,#genre#'); continue
              if in_group and l.strip():
                  hktw.append(l.split(',')[0].strip())
          hktw_expect = [x for x in plan.get('hktw_order', []) if x in set(hktw)]
          if hktw != hktw_expect:
              bad.append('港澳台组顺序与权威表不一致: %s' % ', '.join(hktw))

          for w in warn:
              print('  ⚠', w)
          if bad:
              print('\n校验失败:'); [print('  -', b) for b in bad]; sys.exit(1)
          print('\n校验通过：保底频道 %d 个全部存在，零广告，无地方频道' % len(must))
          PY

      - name: Commit if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add TVLives.txt BiliLive.txt LiveSports.txt
          if git diff --cached --name-only | grep -q .; then
            git commit -m "chore(live): 自动重建直播源（权威频道表保底 + 广告/错台过滤 + 实测可播） $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M') CST"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin HEAD:"${GITHUB_REF_NAME}"
            echo "已提交"
          else
            echo "无变化"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### 直播源自动重建完成"
            echo ""
            echo "文件：TVLives.txt / BiliLive.txt / LiveSports.txt（PlatformLive 已移除）"
            echo ""
            echo '```'
            head -c 2000 TVLives.txt 2>/dev/null | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
