name: Live Sources Rebuild

# 直播源自动重建（每天凌晨 02:17 北京时间跑一次）
# 流程：权威频道表保底(CCTV1-17/31省卫视+深圳/教育台) + 上游补充 → 过滤广告/错台
#       → 逐条实测 IPv4 可播性 → IPv6 备用保留 → 3 IPv4 + 2 IPv6 组装 → 校验 → 提交
#
# 所有筛选逻辑都在本仓库脚本中，CI 仅负责定时触发：
#   scripts/channel_plan.json      权威频道表（保底频道/顺序/保底源）
#   scripts/build_live_sources.py  过滤 + 探测 + 组装
#   scripts/validate_live_sources.py  格式/广告/保底频道/顺序/NewTV 分类校验（失败不提交）

on:
  schedule:
    # 每天北京时间 02:17（UTC 18:17）跑一次，避开整点高峰
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      probe_limit:
        description: '探测总量上限（0=全部，默认500；保底频道不受影响）'
        required: false
        default: '500'

permissions:
  contents: write
  issues: write

concurrency:
  group: live-sources-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild live sources (plan + probe + filter + merge)
        run: |
          # probe-limit 控制探测总量，避免 CI 上全量(800+)探测超时；权威频道表保底不受影响
          python3 scripts/build_live_sources.py --out-dir . --workers 32 --probe-limit "${{ inputs.probe_limit || '500' }}"

      - name: Validate output (format / ad / must-have / order / NewTV groups)
        run: python3 scripts/validate_live_sources.py

      - name: Commit if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add TVLives.txt BiliLive.txt LiveSports.txt
          if git diff --cached --name-only | grep -q .; then
            git commit -m "chore(live): 自动重建直播源（权威频道表保底 + 广告/错台过滤 + 实测可播） $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M') CST"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin HEAD:"${GITHUB_REF_NAME}"
            echo "PURGE=1" >> "$GITHUB_ENV"
            echo "已提交"
          else
            echo "无变化"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Live sources are served via permanent @master URLs. Purge only the
      # changed files after push so the fixed address reflects new channels.
      - name: Purge jsdelivr cache for fixed @master URLs
        if: env.PURGE == '1'
        run: python3 scripts/purge_cdn.py --changed

      - name: Summary
        if: always()
        run: |
          {
            echo "### 直播源自动重建完成"
            echo ""
            echo "文件：TVLives.txt / BiliLive.txt / LiveSports.txt（PlatformLive 已移除）"
            echo ""
            echo '```'
            head -c 2000 TVLives.txt 2>/dev/null | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
