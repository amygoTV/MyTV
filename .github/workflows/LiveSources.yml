name: Live Sources Rebuild

# 直播源自动重建（每天凌晨 02:17 北京时间跑一次）
# 流程：权威频道表保底(CCTV1-17/31省卫视+深圳/教育台) + 上游补充 → 过滤广告台名称/错台
#       （台标正确的正常频道即使插播广告也保留）→ 逐条实测 IPv4 可播性 → IPv6 备用保留
#       → 3 IPv4 + 2 IPv6 组装 → 校验 → 提交
#
# 所有筛选逻辑都在本仓库脚本中，CI 仅负责定时触发：
#   scripts/channel_plan.json      权威频道表（保底频道/顺序/保底源）
#   scripts/build_live_sources.py  过滤 + 探测 + 组装
#   scripts/validate_live_sources.py  格式/广告台名称/黑名单/保底频道/顺序/NewTV 分类校验（失败不提交）

on:
  schedule:
    # 每天北京时间 02:17（UTC 18:17）跑一次，避开整点高峰
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      probe_limit:
        description: '探测总量上限（0=全部，默认500；保底频道不受影响）'
        required: false
        default: '500'

permissions:
  contents: write
  issues: write

concurrency:
  group: live-sources-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild live sources (plan + probe + filter + merge)
        run: |
          # probe-limit 控制探测总量，避免 CI 上全量(800+)探测超时；权威频道表保底不受影响
          python3 scripts/build_live_sources.py --out-dir . --workers 32 --probe-limit "${{ inputs.probe_limit || '500' }}"

      - name: Validate output (format / ad / must-have / order / NewTV groups)
        run: python3 scripts/validate_live_sources.py

      # ⚠️ 必须在 Commit 之前跑：此时 HEAD 还是「重建前」的版本，
      #    与工作区的新产物对比才能算出真实差异。放在 commit 之后 HEAD 已是新版，
      #    diff 会恒为空。
      - name: Generate live sources change report
        id: report
        if: always()
        run: |
          python3 scripts/live_diff_report.py --old HEAD --new . \
            --summary-file /tmp/live_summary.txt > /tmp/live_report.md || true
          {
            echo ""
            cat /tmp/live_report.md
          } >> "$GITHUB_STEP_SUMMARY"
          echo "---- 变更报告（节选）----"
          head -50 /tmp/live_report.md || true
          echo "SUMMARY=$(cat /tmp/live_summary.txt 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      - name: Commit if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          # ⚠️ 必须连 *_v2.* 一起 add：客户端配置引用的是 TVLives_v2.txt /
          # LiveSports_v2.txt / BiliLive_v2.txt（v1.6.6 起改用 v2 新路径规避
          # CDN 陈旧缓存）。此前只 add 主文件，导致 v2 永远停留在旧版本——
          # 工作区里两者一致、validate 照样通过，仓库却已不一致。
          # ⚠️⚠️ 刻意**不要**把 TVLivesBackup.txt / TVLivesBackup.m3u 加进来：
          #   它们是**静态备选源**，不参与每晚重建（2026-11-23 用户明确决定「不动」）。
          #   作用：Action 重建 TVLives_v2.* 时，这批人工核验过的线路仍保留在备选源中，
          #   供客户端「(备)」/「备选直播源」入口使用。
          #   代价：主源新增/删除频道时备选源会落后 —— 这是接受的取舍，
          #   需要时手工同步一次（cp TVLives_v2.txt TVLivesBackup.txt 等）。
          git add TVLives.txt TVLives_v2.txt TVLives.m3u TVLives_v2.m3u \
                  BiliLive.txt BiliLive_v2.txt LiveSports.txt LiveSports_v2.txt
          if git diff --cached --name-only | grep -q .; then
            # 简短统计来自上一步的变更报告（step id: report），
            # 写进 commit message → git log 一眼看出这次改了啥
            # 用 -F 从文件读，避免多行 message 在 YAML 里被误解析
            {
              echo "chore(live): 自动重建直播源（权威频道表保底 + 广告台名称/错台过滤 + 实测可播） ${{ steps.report.outputs.SUMMARY }}"
              echo ""
              echo "$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M') CST"
            } > /tmp/commit_msg.txt
            git commit -F /tmp/commit_msg.txt
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin HEAD:"${GITHUB_REF_NAME}"
            echo "PURGE=1" >> "$GITHUB_ENV"
            echo "已提交"
          else
            echo "无变化"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Live sources are served via permanent @master URLs. Purge only the
      # changed files after push so the fixed address reflects new channels.
      - name: Purge jsdelivr cache for fixed @master URLs
        if: env.PURGE == '1'
        run: python3 scripts/purge_cdn.py --changed

      # 防回归：漏 add *_v2.* 时工作区照样一致、validate 照样通过，
      # 只有比对「已提交的内容」才能发现。客户端读的就是 _v2 那份。
      - name: Verify committed files are consistent
        if: env.PURGE == '1'
        run: |
          set -e
          for pair in "TVLives.txt TVLives_v2.txt" "LiveSports.txt LiveSports_v2.txt" "BiliLive.txt BiliLive_v2.txt"; do
            set -- $pair
            if ! git show "HEAD:$1" | cmp -s - <(git show "HEAD:$2"); then
              echo "::error::已提交的 $1 与 $2 内容不一致（漏提交？），客户端读的是 $2"
              exit 1
            fi
          done
          echo "已提交内容一致性校验通过"

      # 防回归：jsdelivr 的 purge **只覆盖 CF+FY，不覆盖 Gcore 边缘**。
      #   而 TVLives_v2.* / BiliLive_v2.* / LiveSports_v2.* 每天由本工作流重建 →
      #   一旦有配置把它们指向 gcore，该入口就永远是旧版（v1.6.30 实测：gcore 上
      #   的 TVLives_v2.txt 仍是含广告污染源的旧内容，主 cdn 已是新版）。
      #   规则：**每天会变的文件只走 cdn；gcore 只放静态不变的 TVLivesBackup.m3u**。
      - name: Verify no mutable file is served from gcore
        run: |
          set -e
          bad=0
          while IFS= read -r f; do
            hits=$(grep -n "gcore\..*master/TVLives_v2\|gcore\..*master/BiliLive_v2\|gcore\..*master/LiveSports_v2" "$f" || true)
            if [ -n "$hits" ]; then
              echo "::error::$f 把每天重建的源指向 gcore（purge 不覆盖 Gcore → 永远陈旧）: $hits"
              bad=1
            fi
          done < <(find . -name '*.json' -not -path './node_modules/*' -not -path './.git/*')
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "gcore 入口只指向静态文件，校验通过"

      # 防回归：已删除的 PlatformLive.txt 不应再被任何配置引用（v1.4.5 移除 → 404 死链）
      - name: Verify no dangling PlatformLive reference
        run: |
          set -e
          bad=0
          while IFS= read -r f; do
            if grep -q "PlatformLive" "$f"; then
              echo "::error::$f 仍引用已删除的 PlatformLive.txt（404 死链）"
              bad=1
            fi
          done < <(find . -name '*.json' -not -path './node_modules/*' -not -path './.git/*')
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "无 PlatformLive 死链，校验通过"

      - name: Summary
        if: always()
        run: |
          {
            echo "### 直播源自动重建完成"
            echo ""
            echo "产物文件（**主文件 + v2 一起提交**，客户端订阅的是 _v2 那份）："
            echo "- TVLives.txt / **TVLives_v2.txt** / TVLives.m3u / **TVLives_v2.m3u**"
            echo "- BiliLive.txt / **BiliLive_v2.txt**"
            echo "- LiveSports.txt / **LiveSports_v2.txt**"
            echo ""
            echo "静态备选源 TVLivesBackup.txt / TVLivesBackup.m3u **不在重建范围**（抗每晚覆盖，需手工同步）"
            echo ""
            echo '```'
            head -c 2000 TVLives_v2.txt 2>/dev/null | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
